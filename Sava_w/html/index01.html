<!doctype html>
<html lang="pt-BR">
<head>
     <meta charset="utf-8">
     <title>Incorporando Javascript em Páginas HTML</title>
     <!-- Incorporando um arquivo .js externo -->
     <script src="script.js"></script>
</head>
<body>
     <div id="exibe_resultado"> Resultado da Multiplicação: </div>
</body>
     <script type="text/javascript">
        var variavel; //Declarando uma variável cujo nome é 'variavel'

        variavel = 3 + 3;

        /* Alerta na tela - pop-up*/
        alert("Hello, World!");

        var resultadoMultiplicacao = multiplique(10, 60); // chamando a função 'multiplique' passando dois valores - 10 e 60

        /*Configura o nosso elemnto html*/
        var divLocal = document.getElementById('exibe_resultado');
          
        
        divLocal.innerHTML += resultadoMultiplicacao;

        /*1- Cria um elemento - p*/
        /*2- O valor recebido sera "HEllo,World!"*/
        /*3- appendchild, add ao corrpo a const do "p"*/

        /*1*/    const hello = document.createElement("p");
        /*2*/    hello.textContent = "Hello,World!"
        /*2*/    document.body.appendChild(hello);




        //Definição da função 'multiplique' que recebe dois parâmetros - numero1 e numero2
        function multiplique(numero1, numero2){
            var resultado = 0;
            resultado = numero1 * numero2;
            return resultado;

        }
     </script>
</html>
